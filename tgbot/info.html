<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>INFO</title>
    <script src="./info.js"></script>
    <script src="https://cdn.staticfile.org/clipboard.js/2.0.4/clipboard.min.js"></script>

</head>

<body>
    <script>
        // 使用 async/await 方式
        async function checkServiceViaPing() {
            const apiUrl = 'https://v2.xxapi.cn/api/ping?url=tgapi.120322.dpdns.org';

            try {
                const response = await fetch(apiUrl);
                const result = await response.json();

                // 检查返回码是否为 200
                if (result.code === 200 && result.msg === '数据请求成功') {
                    console.log('✅ 服务可以访问');
                    console.log('📊 详细信息:', result.data);
                    // 返回详细数据供后续使用
                    return {
                        available: true,
                        data: result.data
                    };
                } else {
                    console.warn('⚠️ 服务返回异常状态:', result.msg);
                    return {
                        available: false,
                        message: result.msg
                    };
                }
            } catch (error) {
                console.error('❌ 请求接口失败:', error);
                return {
                    available: false,
                    error: error.message
                };
            }
        }

    </script>

    <script>
        checkServiceViaPing().then(status => {
            let info, time;

            if (status.available) {
                info = '✅ 可用';
                time = status.data.time;
            } else {
                info = '❌ 不可用';
                time = '不可用';
            }

            Swal.fire({
                title: "TGBOTAPI公共代理",
                html: `
                    APIHOST：
                    <a href="https://tgapi.120322.dpdns.org/" target="_blank" 
                       style="color: #3085d6; text-decoration: underline;">
                        https://tgapi.120322.dpdns.org/
                    </a><br>
                    <hr>
                    服务站状态: ${info}<br>
                    响应时间: ${time}<br>
                `,
                icon: "info",
                showConfirmButton: false,
                allowEscapeKey: false,
                closeOnClickOutside: false,
                closeOnEsc: false,
                showLoaderOnConfirm: true,
                allowOutsideClick: false,
                showCloseButton: false
            });
        });
    </script>

</body>

</html>
